<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" fill="#e6edf3">
  <!-- How the toolkit works. Drawn in the README banner's dark palette (scripts/render_banner.py).
       Content from README.md (Architecture, Tool table) and docs/overview.md. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="419" rx="14" fill="#0d1117" stroke="#30363d"/>

  <!-- Agents -->
  <g fill="#161b22" stroke="#30363d" stroke-width="1.5">
    <rect x="24" y="88" width="196" height="96" rx="10"/>
    <rect x="24" y="214" width="196" height="96" rx="10"/>
  </g>
  <g text-anchor="middle">
    <text x="122" y="120" font-weight="600" font-size="15">Coding agent</text>
    <text x="122" y="142" font-size="11.5" fill="#9198a1">Claude Code, Codex, Cursor,</text>
    <text x="122" y="158" font-size="11.5" fill="#9198a1">Gemini CLI: MCP or CLI</text>
    <text x="122" y="246" font-weight="600" font-size="15" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace">oneapi-agent loop</text>
    <text x="122" y="268" font-size="11.5" fill="#9198a1">bundled; Claude or Muse</text>
    <text x="122" y="284" font-size="11.5" fill="#9198a1">models; cost cap per run</text>
  </g>

  <!-- Tools -->
  <text x="420" y="50" font-size="11.5" fill="#9198a1" text-anchor="middle">five tools, each returns a ToolResult: status · evidence · limitations</text>
  <g fill="#121d2f" stroke="#4493f8" stroke-width="1.5">
    <rect x="300" y="60" width="240" height="50" rx="9"/>
    <rect x="300" y="122" width="240" height="50" rx="9"/>
    <rect x="300" y="184" width="240" height="50" rx="9"/>
    <rect x="300" y="246" width="240" height="50" rx="9"/>
    <rect x="300" y="308" width="240" height="50" rx="9"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace" font-weight="600" font-size="14.5">
    <text x="318" y="90">migrate</text>
    <text x="318" y="152">compile</text>
    <text x="318" y="214">scan_helpers</text>
    <text x="318" y="276">verify</text>
    <text x="318" y="338">benchmark</text>
  </g>
  <g font-size="11.5" fill="#9198a1" text-anchor="end">
    <text x="526" y="89">runs SYCLomatic</text>
    <text x="526" y="151">icpx -fsycl</text>
    <text x="526" y="213">dpct helpers left</text>
    <text x="526" y="275">vs the reference</text>
    <text x="526" y="337">time per device</text>
  </g>

  <!-- agent to tools -->
  <g stroke="#6e7681" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M220 136 H296"/>
    <path d="M220 262 H296"/>
  </g>
  <text x="258" y="128" font-size="11" fill="#9198a1" text-anchor="middle">call</text>
  <text x="258" y="254" font-size="11" fill="#9198a1" text-anchor="middle">call</text>

  <!-- done rule -->
  <rect x="610" y="150" width="190" height="112" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <g text-anchor="middle">
    <text x="705" y="180" font-weight="600" font-size="15" fill="#3fb950">Done?</text>
    <text x="705" y="203" font-size="11.5" fill="#9198a1">compile ok, verify ok and</text>
    <text x="705" y="219" font-size="11.5" fill="#9198a1">0 dpct helpers, all on the</text>
    <text x="705" y="235" font-size="11.5" fill="#9198a1">same current source</text>
  </g>
  <g stroke="#6e7681" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M540 209 H606"/>
  </g>

  <!-- not yet: back to the agent -->
  <path d="M705 150 V30 H122 V84" stroke="#f85149" stroke-width="1.5" fill="none" marker-end="url(#r)"/>
  <text x="712" y="70" font-size="11.5" fill="#f85149">not yet: the evidence</text>
  <text x="712" y="86" font-size="11.5" fill="#f85149">goes back to the agent</text>

  <!-- GPU check -->
  <rect x="838" y="150" width="140" height="112" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="908" y="180" font-weight="600" font-size="15">GPU check</text>
    <text x="908" y="203" font-size="11.5" fill="#9198a1">rented NVIDIA or</text>
    <text x="908" y="219" font-size="11.5" fill="#9198a1">AMD; machine</text>
    <text x="908" y="235" font-size="11.5" fill="#9198a1">always deleted</text>
  </g>
  <path d="M800 206 H834" stroke="#3fb950" stroke-width="1.5" fill="none" marker-end="url(#g)"/>
  <text x="817" y="198" font-size="11" fill="#3fb950" text-anchor="middle">yes</text>

  <!-- traces -->
  <rect x="610" y="308" width="368" height="50" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="794" y="330" font-size="11.5" fill="#9198a1" text-anchor="middle">every call, result and source hash is written to</text>
  <text x="794" y="347" font-size="11.5" fill="#9198a1" text-anchor="middle">trace.jsonl and report.md; a replay page is made from it</text>
  <path d="M540 333 H606" stroke="#6e7681" stroke-width="1.5" fill="none" stroke-dasharray="2 4" marker-end="url(#a)"/>

  <text x="24" y="398" font-size="11.5" fill="#9198a1">The model cannot pick verify's commands or tolerances, and cannot write outside its work directory.</text>
</svg>
