name: sycl-hip-upstream-check
# Test only, publishes no release: builds an intel/llvm commit that has the upstream fixes for
# intel/llvm#23531 (PR #23689) and #23532 (PR #23690) with NO_WORKAROUNDS=1, i.e. without the two
# naming workarounds in scripts/build-sycl-hip.sh. If the script's smoke test still compiles and
# links for gfx942 and gfx950, both workarounds can be dropped.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sycl-hip-upstream-check.yml
env:
  INTEL_LLVM_REF: 6197e5b819f2746ad99a6a1e62a2a17b89f49d88  # intel/llvm sycl, 2026-11-12, merge of PR #23690
  ROCM_VERSION: "7.0"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -af >/dev/null || true
          sudo mkdir -p /mnt/work && sudo chmod 777 /mnt/work
          df -h / /mnt
      - name: Build without workarounds (Ubuntu 22.04 container)
        run: |
          WORK=/mnt/work
          [ "$(df --output=avail -B1G /mnt | tail -1)" -ge 40 ] || WORK="$RUNNER_TEMP/work"
          mkdir -p "$WORK"
          rc=0
          docker run --rm -e INTEL_LLVM_REF -e ROCM_VERSION -e JOBS=4 -e NO_WORKAROUNDS=1 \
            -v "$PWD:/src:ro" -v "$WORK:/work" ubuntu:22.04 \
            bash /src/scripts/build-sycl-hip.sh /work || rc=$?
          sudo mkdir -p out && { sudo cp "$WORK"/out/* out/ || true; } && sudo chown -R "$USER" out
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sycl-hip-upstream-check
          path: out/
          retention-days: 7
