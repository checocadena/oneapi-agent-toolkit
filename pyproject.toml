[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneapi-agent-toolkit"
version = "0.3.0"
description = "Evidence-driven MCP toolkit that makes coding agents fluent in oneAPI/SYCL (last-mile CUDA-to-SYCL migration)."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "Checo Cadena", email = "checo@innercircuit.com" }]
keywords = ["oneapi", "sycl", "cuda", "syclomatic", "mcp", "coding-agent", "claude"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Compilers",
  "Environment :: Console",
]

dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
agent = ["anthropic>=0.40"]
keyring = ["keyring>=24"]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]
all = ["mcp>=1.2", "anthropic>=0.40", "keyring>=24", "pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/checocadena/oneapi-agent-toolkit"
Issues = "https://github.com/checocadena/oneapi-agent-toolkit/issues"

[project.scripts]
oneapi-agent = "oneapi_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oneapi_agent = ["skill/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "toolchain: needs the real oneAPI toolchain (icpx, c2s, sycl-ls); skipped when absent",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
