[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneapi-agent-toolkit"
version = "0.1.0"
description = "Evidence-driven MCP toolkit that makes coding agents fluent in oneAPI/SYCL (last-mile CUDA-to-SYCL migration)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "oneapi-agent-toolkit contributors" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
agent = ["anthropic>=0.40"]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]
all = ["mcp>=1.2", "anthropic>=0.40", "pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
oneapi-agent = "oneapi_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "toolchain: needs the real oneAPI toolchain (icpx, c2s, sycl-ls); skipped when absent",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
